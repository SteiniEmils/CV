<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Þorsteinn Emilsson — CV</title>
    <meta name="description" content="Personal CV of Þorsteinn Emilsson" />
    <style>
      html { background: #f5f3ef; color-scheme: light; }
      html[data-theme='dark'] { background: #0b1117; color-scheme: dark; }
      @media print {
        html, html[data-theme='dark'] { background: #ffffff !important; color-scheme: light; }
      }
    </style>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cv-theme')
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
