<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Editor</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #ffffff;
      --text: #111a22;
      --muted: #586572;
      --accent: #a86635;
      --accent-hover: #c17a43;
      --border: #d8d5cf;
      --radius: 8px;
      --shadow: 0 8px 18px -6px rgba(17, 26, 34, 0.1);
    }
    [data-theme='dark'] {
      --bg: #0b1117;
      --surface: #131c24;
      --text: #f2f4f5;
      --muted: #a7b2bc;
      --accent: #d69a62;
      --accent-hover: #e8b784;
      --border: #2a3743;
      --shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .header-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { font-size: 1.25rem; margin: 0; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    h2 {
      margin: 0 0 18px;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 680px) {
      .grid-2 { grid-template-columns: 1fr 1fr; }
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.95rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea { min-height: 80px; resize: vertical; }
    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .list { display: flex; flex-direction: column; gap: 16px; }
    .item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      background: var(--bg);
      position: relative;
    }
    .item-fields { display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .row-4 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 680px) {
      .row-4 { grid-template-columns: repeat(4, 1fr); }
    }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
    button.danger {
      background: transparent;
      color: #c0392b;
      border: 1px solid #c0392b;
    }
    button.danger:hover { background: #c0392b; color: #fff; }
    button.add { margin-top: 12px; }
    button.remove {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
    }
    #status {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 18px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      display: none;
    }
    #status.show { display: block; }
    .load { text-align: center; padding: 60px; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <div class="header-wrap">
      <h1>CV Editor</h1>
      <div class="toolbar">
        <button class="secondary" onclick="window.open('/', '_blank')">View CV</button>
        <button onclick="save()">Save changes</button>
      </div>
    </div>
  </header>

  <main>
    <div class="load" id="load">Loading CV…</div>
    <form id="editor" style="display:none">
      <section>
        <h2>Basics</h2>
        <div class="grid-2">
          <div class="field"><label for="name">Name</label><input id="name" data-id="name"></div>
          <div class="field"><label for="title">Title</label><input id="title" data-id="title"></div>
          <div class="field"><label for="location">Location</label><input id="location" data-id="location"></div>
          <div class="field"><label for="email">Email</label><input id="email" data-id="email"></div>
          <div class="field"><label for="phone">Phone</label><input id="phone" data-id="phone"></div>
          <div class="field"><label for="github">GitHub URL</label><input id="github" data-id="github"></div>
          <div class="field"><label for="website">Website URL</label><input id="website" data-id="website"></div>
          <div class="field"><label for="linkedin">LinkedIn URL</label><input id="linkedin" data-id="linkedin"></div>
        </div>
        <div class="field" style="margin-top:16px">
          <label for="summary">Summary</label>
          <textarea id="summary" data-id="summary"></textarea>
        </div>
      </section>

      <section>
        <h2>Skills</h2>
        <div class="field">
          <label for="skills">Skill list</label>
          <textarea id="skills" data-id="skills" placeholder="Flutter, Dart, React…"></textarea>
          <p class="hint">Separate skills with commas or new lines.</p>
        </div>
      </section>

      <section>
        <h2>Skill categories</h2>
        <div id="skillCategories-list" class="list"></div>
        <button type="button" class="secondary add" onclick="addItem('skillCategories')">+ Add category</button>
      </section>

      <section>
        <h2>Experience</h2>
        <div id="experience-list" class="list"></div>
        <button type="button" class="secondary add" onclick="addItem('experience')">+ Add experience</button>
      </section>

      <section>
        <h2>Education</h2>
        <div id="education-list" class="list"></div>
        <button type="button" class="secondary add" onclick="addItem('education')">+ Add education</button>
      </section>

      <section>
        <h2>Projects</h2>
        <div id="projects-list" class="list"></div>
        <button type="button" class="secondary add" onclick="addItem('projects')">+ Add project</button>
      </section>

      <section>
        <h2>Stats</h2>
        <div id="stats-list" class="list"></div>
        <button type="button" class="secondary add" onclick="addItem('stats')">+ Add stat</button>
      </section>
    </form>
  </main>

  <div id="status"></div>

  <template id="tpl-skillCategories">
    <div class="item">
      <button type="button" class="danger remove" onclick="removeItem(this)">Remove</button>
      <div class="item-fields">
        <div class="field"><label>Category name</label><input type="text" data-key="category" oninput="update(this)"></div>
        <div class="field"><label>Skills</label><textarea data-key="items" oninput="update(this)" placeholder="Skill one, Skill two…"></textarea><p class="hint">Separate with commas or new lines.</p></div>
      </div>
    </div>
  </template>

  <template id="tpl-experience">
    <div class="item">
      <button type="button" class="danger remove" onclick="removeItem(this)">Remove</button>
      <div class="item-fields">
        <div class="field"><label>Role</label><input type="text" data-key="role" oninput="update(this)"></div>
        <div class="field"><label>Company</label><input type="text" data-key="company" oninput="update(this)"></div>
        <div class="row-4">
          <div class="field"><label>Start</label><input type="text" data-key="start" oninput="update(this)"></div>
          <div class="field"><label>End</label><input type="text" data-key="end" oninput="update(this)"></div>
        </div>
        <div class="field"><label>Description</label><textarea data-key="description" oninput="update(this)"></textarea></div>
      </div>
    </div>
  </template>

  <template id="tpl-education">
    <div class="item">
      <button type="button" class="danger remove" onclick="removeItem(this)">Remove</button>
      <div class="item-fields">
        <div class="field"><label>Degree</label><input type="text" data-key="degree" oninput="update(this)"></div>
        <div class="field"><label>Institution</label><input type="text" data-key="institution" oninput="update(this)"></div>
        <div class="row-4">
          <div class="field"><label>Start</label><input type="text" data-key="start" oninput="update(this)"></div>
          <div class="field"><label>End</label><input type="text" data-key="end" oninput="update(this)"></div>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-projects">
    <div class="item">
      <button type="button" class="danger remove" onclick="removeItem(this)">Remove</button>
      <div class="item-fields">
        <div class="field"><label>Name</label><input type="text" data-key="name" oninput="update(this)"></div>
        <div class="field"><label>URL</label><input type="text" data-key="url" oninput="update(this)"></div>
        <div class="field"><label>Technologies</label><input type="text" data-key="tech" oninput="update(this)"></div>
        <div class="field"><label>Description</label><textarea data-key="description" oninput="update(this)"></textarea></div>
      </div>
    </div>
  </template>

  <template id="tpl-stats">
    <div class="item">
      <button type="button" class="danger remove" onclick="removeItem(this)">Remove</button>
      <div class="item-fields row-4">
        <div class="field"><label>Value</label><input type="text" data-key="value" oninput="update(this)"></div>
        <div class="field"><label>Label</label><input type="text" data-key="label" oninput="update(this)"></div>
      </div>
    </div>
  </template>

  <script>
    let data = {}

    const schema = {
      skillCategories: { category: '', items: '' },
      experience: { role: '', company: '', start: '', end: '', description: '' },
      education: { degree: '', institution: '', start: '', end: '' },
      projects: { name: '', description: '', url: '', tech: '' },
      stats: { value: '', label: '' }
    }

    async function load() {
      try {
        const res = await fetch('/api/cv')
        data = await res.json()

        data.skills = data.skills.join(', ')
        data.skillCategories.forEach(c => c.items = c.items.join(', '))

        render()
        document.getElementById('load').style.display = 'none'
        document.getElementById('editor').style.display = 'block'
      } catch (err) {
        show('Error loading CV: ' + err.message, true)
      }
    }

    function render() {
      document.querySelectorAll('[data-id]').forEach(el => {
        const key = el.dataset.id
        el.value = data[key] ?? ''
      })
      Object.keys(schema).forEach(renderSection)
    }

    function renderSection(section) {
      const container = document.getElementById(section + '-list')
      const tpl = document.getElementById('tpl-' + section)
      container.innerHTML = ''

      data[section].forEach((item, i) => {
        const el = tpl.content.cloneNode(true).firstElementChild
        el.dataset.section = section
        el.dataset.index = i

        el.querySelectorAll('[data-key]').forEach(input => {
          input.dataset.section = section
          input.dataset.index = i
          input.value = item[input.dataset.key] ?? ''
        })

        container.appendChild(el)
      })
    }

    function update(el) {
      if (el.dataset.id) {
        data[el.dataset.id] = el.value
      } else if (el.dataset.section) {
        data[el.dataset.section][parseInt(el.dataset.index)][el.dataset.key] = el.value
      }
    }

    function addItem(section) {
      data[section].push({ ...schema[section] })
      renderSection(section)
    }

    function removeItem(btn) {
      const item = btn.closest('.item')
      const section = item.dataset.section
      const index = parseInt(item.dataset.index)
      data[section].splice(index, 1)
      renderSection(section)
    }

    function toArray(s) {
      return (s || '').split(/[,\n]+/).map(x => x.trim()).filter(Boolean)
    }

    function show(msg, isError) {
      const status = document.getElementById('status')
      status.textContent = msg
      status.style.color = isError ? '#c0392b' : 'var(--text)'
      status.classList.add('show')
      setTimeout(() => status.classList.remove('show'), 4000)
    }

    async function save() {
      const payload = JSON.parse(JSON.stringify(data))
      payload.skills = toArray(payload.skills)
      payload.skillCategories.forEach(c => c.items = toArray(c.items))

      try {
        const res = await fetch('/api/cv', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        const result = await res.json()
        if (res.ok) {
          show('Saved. Run npm run build when you want to update the live site.')
        } else {
          show('Error: ' + (result.error || 'unknown'), true)
        }
      } catch (err) {
        show('Error: ' + err.message, true)
      }
    }

    load()
  </script>
</body>
</html>
