<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Editor</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #ffffff;
      --text: #111a22;
      --muted: #586572;
      --accent: #a86635;
      --accent-hover: #c17a43;
      --border: #d8d5cf;
    }
    [data-theme='dark'] {
      --bg: #0b1117;
      --surface: #131c24;
      --text: #f2f4f5;
      --muted: #a7b2bc;
      --accent: #d69a62;
      --accent-hover: #e8b784;
      --border: #2a3743;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 20px; color: var(--muted); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover { border-color: var(--accent); color: var(--accent); background: transparent; }
    textarea {
      width: 100%;
      height: 70vh;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      resize: vertical;
    }
    #status {
      margin-top: 12px;
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CV Editor</h1>
    <p>Edit the JSON below and click Save. Then run <code>npm run build</code> to update the live site.</p>
    <div class="toolbar">
      <button id="save">Save changes</button>
      <button class="secondary" id="reset">Reset to saved</button>
      <button class="secondary" id="preview">Open CV</button>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
    <div id="status"></div>
  </div>

  <script>
    const editor = document.getElementById('editor')
    const status = document.getElementById('status')

    async function load() {
      try {
        const res = await fetch('/api/cv')
        const json = await res.json()
        editor.value = JSON.stringify(json, null, 2)
        status.textContent = 'Loaded.'
      } catch (err) {
        status.textContent = 'Error loading CV: ' + err.message
      }
    }

    document.getElementById('save').addEventListener('click', async () => {
      let data
      try {
        data = JSON.parse(editor.value)
      } catch (err) {
        status.textContent = 'Invalid JSON: ' + err.message
        return
      }
      try {
        const res = await fetch('/api/cv', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
        const result = await res.json()
        if (res.ok) {
          status.textContent = 'Saved and generated src/data/cv.ts. Build + deploy to update the live site.'
        } else {
          status.textContent = 'Error: ' + (result.error || 'unknown')
        }
      } catch (err) {
        status.textContent = 'Error saving: ' + err.message
      }
    })

    document.getElementById('reset').addEventListener('click', () => {
      load()
    })

    document.getElementById('preview').addEventListener('click', () => {
      window.open('/', '_blank')
    })

    load()
  </script>
</body>
</html>
