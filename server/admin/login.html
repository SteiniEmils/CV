<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Admin Login</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --surface: #ffffff;
      --text: #111a22;
      --muted: #586572;
      --accent: #a86635;
      --accent-hover: #c17a43;
      --border: #d8d5cf;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 12px 28px -10px rgba(17, 26, 34, 0.14);
    }
    h1 { margin: 0 0 6px; font-size: 1.35rem; }
    p { margin: 0 0 24px; color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .error {
      display: none;
      margin-top: 14px;
      padding: 10px;
      background: #fbeae8;
      color: #c0392b;
      border-radius: 6px;
      font-size: 0.9rem;
      text-align: center;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="/admin/login">
    <h1>CV Admin</h1>
    <p>Enter the admin password to edit the CV.</p>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" autocomplete="current-password" autofocus required />
    <button type="submit">Log in</button>
    <div class="error" id="error">Wrong password. Try again.</div>
  </form>

  <script>
    if (window.location.search.includes('error=1')) {
      document.getElementById('error').classList.add('show')
    }
  </script>
</body>
</html>
