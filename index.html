    <!-- cv-meta:end -->
    <!-- cv-settings:start -->
    <script id="cv-site-settings" type="application/json">{"appearance":"default","colorScheme":"light"}</script>
    <!-- cv-settings:end -->
    <style>
      html { background: #f5f3ef; color-scheme: light; }
      html[data-theme='dark'] { background: #0b1117; color-scheme: dark; }
      html[data-appearance='paper'][data-theme='light'] { background: #4f4c47; color-scheme: light; }
      html[data-appearance='paper'][data-theme='dark'] { background: #070708; color-scheme: dark; }
      @media print {
        html, html[data-theme='dark'], html[data-appearance='paper'] { background: #ffffff !important; color-scheme: light; }
      }
    </style>
    <script>
      (function () {
        try {
          var site = { appearance: 'default', colorScheme: 'light' }
          var settingsEl = document.getElementById('cv-site-settings')
          if (settingsEl && settingsEl.textContent) {
            site = JSON.parse(settingsEl.textContent)
          }
          var appearance = site.appearance === 'paper' ? 'paper' : 'default'
          var savedTheme = localStorage.getItem('cv-theme')
          var theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (site.colorScheme === 'dark' ? 'dark' : 'light')
          document.documentElement.dataset.appearance = appearance
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
